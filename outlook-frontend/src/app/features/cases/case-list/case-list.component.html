<div class="list-group list-group-flush h-100 overflow-auto custom-scrollbar">
    <div *ngIf="loading()" class="p-5 text-center">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        <div class="mt-2 text-muted small">Fetching queue...</div>
    </div>

    <div *ngIf="!loading() && cases().length === 0" class="p-5 text-center text-muted">
        <i class="bi bi-inbox fs-2 d-block mb-3 opacity-10"></i>
        <h6 class="fw-semibold small">Queue is empty</h6>
        <p class="small text-secondary mb-0">No active cases found in this folder.</p>
    </div>

    <button *ngFor="let item of cases()" type="button"
        class="list-group-item list-group-item-action border-0 mb-1 case-item" [class.active]="selectedId() === item.id"
        (click)="selectCase(item.id)">

        <div class="d-flex justify-content-between align-items-start mb-1">
            <div class="candidate-name text-truncate pe-2">{{ item.candidateFullName }}</div>
            <div class="date-text text-nowrap">{{ item.expectedVisitDate | date:'MMM d' }}</div>
        </div>

        <div class="package-name text-truncate">{{ item.packageName }}</div>

        <div class="case-meta">
            <div class="d-flex align-items-center gap-2">
                <div class="status-indicator" [ngClass]="'status-' + getStatusColor(item.status)"></div>
                <span class="case-id">REQ #{{ item.caseID }}</span>
            </div>

            <div class="d-flex gap-2 opacity-25">
                <i class="bi bi-paperclip small" *ngIf="item.hasAttachments"></i>
                <i class="bi bi-flag small"></i>
            </div>
        </div>
    </button>
</div>
