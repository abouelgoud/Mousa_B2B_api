<div class="login-container">
    <div class="auth-card">
        <div class="brand-section">
            <div class="logo-container">
                <i class="bi bi-activity"></i>
                <span>B2B Health</span>
            </div>
            <h1>Sign in</h1>
            <p>to continue to B2B Health Portal</p>
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm">
            <div class="form-group pb-2">
                <div class="input-wrapper">
                    <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Email, phone, or Skype"
                        required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="Password"
                        required autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" (click)="showPassword = !showPassword" aria-label="Toggle password visibility">
                        <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
                    </button>
                </div>
            </div>

            <div class="form-footer">
                <a href="#" class="forgot-pass" (click)="$event.preventDefault()">Can't access your account?</a>
            </div>

            <div class="d-flex justify-content-end">
                <button type="submit" class="submit-btn" [disabled]="loading || !loginForm.form.valid">
                    {{ loading ? 'Signing in...' : 'Next' }}
                </button>
            </div>
        </form>
    </div>
</div>
