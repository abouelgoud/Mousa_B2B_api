<div class="d-flex flex-column h-100 vh-100 overflow-hidden">
    <!-- Top Header (Outlook Style) -->
    <header class="app-header d-flex align-items-center justify-content-between px-3">
        <!-- Left: App Launcher & Branding -->
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-icon p-2 rounded-0 text-white app-launcher-btn" title="App Launcher">
                <i class="bi bi-grid-3x3-gap-fill fs-5"></i>
            </button>
            <span class="navbar-brand fw-semibold text-white fs-6">B2B Health</span>
        </div>

        <!-- Center: Search Bar -->
        <div class="search-container d-none d-md-flex flex-grow-1 justify-content-center mx-4">
            <div class="input-group search-box">
                <span class="input-group-text bg-white border-0 text-secondary"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control border-0 shadow-none bg-white small"
                    placeholder="Search (Alt+Q)">
            </div>
        </div>

        <!-- Right: Actions & Profile -->
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-icon text-white p-2" title="Notifications">
                <i class="bi bi-bell fs-5"></i>
            </button>
            <button class="btn btn-icon text-white p-2" title="Settings">
                <i class="bi bi-gear fs-5"></i>
            </button>

            <!-- User Profile Dropdown -->
            <div class="dropdown ms-2">
                <a href="#" class="d-flex align-items-center text-decoration-none" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <div class="avatar bg-white text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold"
                        style="width: 32px; height: 32px; font-size: 13px; cursor: pointer;">
                        {{ getInitials() }}
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" style="min-width: 200px;">
                    <li class="px-3 py-2 border-bottom">
                        <div class="fw-bold text-dark small">{{ authService.currentUser()?.username }}</div>
                        <div class="text-muted small text-truncate" style="max-width: 180px;">{{
                            authService.currentUser()?.email }}</div>
                    </li>
                    <li><a class="dropdown-item py-2 small" routerLink="/profile"><i class="bi bi-person me-2"></i>My
                            Profile</a></li>
                    <li><a class="dropdown-item py-2 small" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item py-2 small text-danger" href="#" (click)="logout($event)"><i
                                class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="d-flex flex-grow-1 overflow-hidden">
        <!-- Left Sidebar (App Rail) -->
        <nav class="app-rail d-flex flex-column bg-light border-end pt-2 pb-3 align-items-center">
            <ng-container *ngFor="let item of filteredNavItems()">
                <div *ngIf="item.divider" class="border-bottom w-50 my-2 opacity-25"></div>

                <button *ngIf="!item.divider"
                    class="btn btn-rail position-relative mb-1 d-flex flex-column align-items-center justify-content-center"
                    [routerLink]="item.route" routerLinkActive="active" [title]="item.label">
                    <i class="bi {{ item.icon }} fs-5 mb-1"></i>
                    <span class="small-label">{{ item.label }}</span>
                    <!-- Optional: show label if needed, usually hidden on very slim rail -->

                    <!-- Notification dot example -->
                    <span *ngIf="item.label === 'Worklist'"
                        class="position-absolute top-0 end-0 translate-middle p-1 bg-danger border border-light rounded-circle"
                        style="width: 8px; height: 8px; right: 8px !important; top: 8px !important;">
                    </span>
                </button>
            </ng-container>

            <!-- Bottom Rail Items -->
            <div class="mt-auto d-flex flex-column align-items-center gap-1 w-100">
                <button class="btn btn-rail text-muted" title="Help">
                    <i class="bi bi-question-circle fs-5"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-grow-1 bg-body overflow-hidden position-relative router-container">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
