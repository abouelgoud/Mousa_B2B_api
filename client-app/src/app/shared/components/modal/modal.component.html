<div *ngIf="isOpen" class="modal-backdrop d-flex align-items-center justify-content-center"
    (click)="onBackdropClick($event)">
    <div class="modal-dialog bg-surface rounded-lg shadow-lg d-flex flex-column" role="dialog" aria-modal="true">

        <div class="modal-header d-flex align-items-center justify-content-between p-4 border-bottom">
            <h5 class="modal-title fw-bold m-0">{{ title }}</h5>
            <button class="btn-close" type="button" aria-label="Close" (click)="close()"></button>
        </div>

        <div class="modal-body p-4 overflow-auto">
            <ng-content></ng-content>
        </div>

        <div class="modal-footer p-4 border-top d-flex justify-content-end gap-2">
            <ng-content select="[modal-footer]"></ng-content>
        </div>
    </div>
</div>
