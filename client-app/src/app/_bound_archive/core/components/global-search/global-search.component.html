<div class="search-box position-relative">
    <div class="input-group input-group-sm glass-input rounded-3 overflow-hidden">
        <span class="input-group-text border-0 bg-transparent text-muted"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-0 bg-transparent"
            placeholder="Search cases, companies, providers Ctrl+K" [(ngModel)]="searchQuery" (input)="onSearch()">
        <span class="input-group-text border-0 bg-transparent text-muted small px-3">⌘K</span>
    </div>

    <!-- Quick Results Overlay -->
    <div class="search-results shadow-lg border rounded-3 mt-2" *ngIf="showResults">
        <div class="p-2 border-bottom bg-light">
            <small class="text-uppercase fw-bold text-muted" style="font-size: 10px;">Recent Screening Cases</small>
        </div>
        <div class="result-list overflow-auto" style="max-height: 300px;">
            <a routerLink="/requests/list"
                class="result-item p-2 d-flex align-items-center gap-3 text-decoration-none text-dark"
                (click)="closeSearch()">
                <div
                    class="avatar-xs bg-primary-subtle text-primary rounded d-flex align-items-center justify-content-center">
                    <i class="bi bi-file-earmark-text"></i>
                </div>
                <div>
                    <div class="fw-semibold small">B2B-20240123-A7B2C1</div>
                    <div class="text-muted" style="font-size: 11px;">Candidate: John Doe • Status: Pending</div>
                </div>
            </a>

            <div class="p-2 border-bottom bg-light">
                <small class="text-uppercase fw-bold text-muted" style="font-size: 10px;">Healthcare Providers</small>
            </div>
            <a routerLink="/provider/list"
                class="result-item p-2 d-flex align-items-center gap-3 text-decoration-none text-dark"
                (click)="closeSearch()">
                <div
                    class="avatar-xs bg-info-subtle text-info rounded d-flex align-items-center justify-content-center">
                    <i class="bi bi-hospital"></i>
                </div>
                <div>
                    <div class="fw-semibold small">Royal Medical Center</div>
                    <div class="text-muted" style="font-size: 11px;">Location: Riyadh, SA</div>
                </div>
            </a>
        </div>
        <div class="p-2 text-center border-top">
            <button class="btn btn-link btn-sm text-primary text-decoration-none">Advanced Search Options</button>
        </div>
    </div>
</div>
