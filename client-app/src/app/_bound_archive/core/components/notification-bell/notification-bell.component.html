<div class="notification-wrapper position-relative">
    <button class="btn btn-icon rounded-circle position-relative" (click)="toggleDropdown()">
        <i class="bi bi-bell fs-5"></i>
        <span *ngIf="notificationService.unreadCount() > 0"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white">
            {{ notificationService.unreadCount() }}
        </span>
    </button>

    <div class="notification-dropdown shadow-lg rounded-3 p-0" *ngIf="showDropdown">
        <div class="dropdown-header bg-light p-3 border-bottom d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold">Notifications</h6>
            <span class="badge bg-primary-subtle text-primary">{{ notificationService.notifications().length }}
                Total</span>
        </div>

        <div class="notification-list overflow-auto" style="max-height: 400px;">
            <div *ngFor="let notif of notificationService.notifications()"
                class="notification-item p-3 border-bottom d-flex gap-3 align-items-start"
                [class.unread]="!notif.isRead">
                <div
                    class="icon-box rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center flex-shrink-0">
                    <i class="bi bi-info-circle"></i>
                </div>
                <div class="flex-grow-1">
                    <p class="mb-1 small">{{ notif.message }}</p>
                    <span class="text-muted" style="font-size: 11px;">Just now</span>
                </div>
                <button *ngIf="!notif.isRead" class="btn btn-link p-0 text-primary small mt-1"
                    (click)="markAsRead(notif.id, $event)">
                    Mark read
                </button>
            </div>

            <div *ngIf="notificationService.notifications().length === 0" class="p-5 text-center text-muted">
                <i class="bi bi-check2-circle fs-3 mb-2 d-block"></i>
                <p class="small mb-0">All caught up!</p>
            </div>
        </div>

        <div class="dropdown-footer p-2 text-center border-top">
            <button class="btn btn-link btn-sm text-decoration-none">View All Activity</button>
        </div>
    </div>
</div>
