<div class="container-fluid py-4" *ngIf="!loading && !error; else loadingOrError">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-primary fw-bold mb-0">Edit Company</h2>
            <p class="text-muted mb-0">Update company profile and settings.</p>
        </div>
        <button class="btn btn-outline-secondary" [routerLink]="['/company/details', companyId]">
            Cancel
        </button>
    </div>

    <div class="card border-0 shadow-sm glass-card">
        <div class="card-body p-4">
            <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
                <div class="row g-4">

                    <div class="col-md-6">
                        <label class="form-label">Legal Name</label>
                        <input type="text" class="form-control" formControlName="legalName"
                            [class.is-invalid]="editForm.get('legalName')?.invalid && editForm.get('legalName')?.touched">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">CR Number</label>
                        <input type="text" class="form-control" formControlName="crNumber"
                            [class.is-invalid]="editForm.get('crNumber')?.invalid && editForm.get('crNumber')?.touched">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Head Office Address</label>
                        <input type="text" class="form-control" formControlName="headOfficeAddress">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Business Activity</label>
                        <input type="text" class="form-control" formControlName="businessActivity">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Company Size</label>
                        <select class="form-select" formControlName="companySize">
                            <option [value]="0">Small (1-50)</option>
                            <option [value]="1">Medium (51-200)</option>
                            <option [value]="2">Large (201+)</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Total Employees</label>
                        <input type="number" class="form-control" formControlName="totalEmployees">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Est. Monthly Volume</label>
                        <input type="number" class="form-control" formControlName="estimatedMonthlyScreeningVolume">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">VAT Registration</label>
                        <input type="text" class="form-control" formControlName="vatRegistrationNumber">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Provider Assignment Mode</label>
                        <select class="form-select" formControlName="defaultProviderAssignmentMode">
                            <option [value]="0">Single Preferred</option>
                            <option [value]="1">Automatic</option>
                            <option [value]="2">Multi-Provider</option>
                        </select>
                    </div>

                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4" [disabled]="editForm.invalid || saving">
                        <span *ngIf="saving" class="spinner-border spinner-border-sm me-2" role="status"
                            aria-hidden="true"></span>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<ng-template #loadingOrError>
    <div class="text-center py-5" *ngIf="loading">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <div class="text-center py-5 alert alert-danger" *ngIf="error">
        {{ error }}
    </div>
</ng-template>
