<div class="container-fluid py-4" *ngIf="!loading && !error; else loadingOrError">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-primary fw-bold mb-0">Edit Provider</h2>
            <p class="text-muted mb-0">Update provider operational details.</p>
        </div>
        <button class="btn btn-outline-secondary" [routerLink]="['/provider/details', providerId]">
            Cancel
        </button>
    </div>

    <div class="card border-0 shadow-sm glass-card">
        <div class="card-body p-4">
            <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
                <div class="row g-4">

                    <div class="col-md-12">
                        <label class="form-label">Legal Name</label>
                        <input type="text" class="form-control" formControlName="legalName"
                            [class.is-invalid]="editForm.get('legalName')?.invalid && editForm.get('legalName')?.touched">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Daily Capacity</label>
                        <input type="number" class="form-control" formControlName="estimatedDailyOperationalCapacity">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Lab Setup</label>
                        <select class="form-select" formControlName="labSetup">
                            <option [value]="0">In-house High Complexity</option>
                            <option [value]="1">In-house Basic</option>
                            <option [value]="2">Outsourced</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tier</label>
                        <select class="form-select" formControlName="tierId">
                            <option [value]="1">Standard</option>
                            <option [value]="2">Premium</option>
                            <option [value]="3">Enterprise</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Latitude</label>
                        <input type="number" step="any" class="form-control" formControlName="latitude"
                            placeholder="e.g. 24.7136">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Longitude</label>
                        <input type="number" step="any" class="form-control" formControlName="longitude"
                            placeholder="e.g. 46.6753">
                    </div>

                    <div class="col-12">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            To update license documents, please contact support or re-onboard the provider.
                        </div>
                    </div>

                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4" [disabled]="editForm.invalid || saving">
                        <span *ngIf="saving" class="spinner-border spinner-border-sm me-2" role="status"
                            aria-hidden="true"></span>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<ng-template #loadingOrError>
    <div class="text-center py-5" *ngIf="loading">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <div class="text-center py-5 alert alert-danger" *ngIf="error">
        {{ error }}
    </div>
</ng-template>
