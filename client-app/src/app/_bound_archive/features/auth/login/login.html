<div class="login-container d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg p-5">
    <div class="text-center mb-4">
      <div class="logo-placeholder mb-3">
        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
      </div>
      <h2 class="fw-bold text-primary">B2B Healthcare</h2>
      <p class="text-muted">Sign in to continue to your dashboard</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
          <input type="email" formControlName="email" class="form-control bg-light border-start-0" placeholder="user@example.com">
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors" class="text-danger small mt-1">
          Please enter a valid email.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-muted small fw-bold">PASSWORD</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
          <input type="password" formControlName="password" class="form-control bg-light border-start-0" placeholder="••••••••">
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors" class="text-danger small mt-1">
          Password must be at least 6 characters.
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 small mb-3">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" [disabled]="loginForm.invalid || loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'SIGNING IN...' : 'SIGN IN' }}
      </button>

      <div class="text-center mt-4">
        <a href="#" class="text-decoration-none small text-muted">Forgot password?</a>
      </div>
    </form>
  </div>
</div>
