<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-primary fw-bold mb-0">Package Management</h2>
            <p class="text-muted mb-0">Define and manage medical service packages</p>
        </div>
        <button class="btn btn-primary" [routerLink]="['/packages/add']">
            <i class="bi bi-plus-lg me-1"></i> Create Package
        </button>
    </div>

    <div class="card border-0 shadow-sm glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Package Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Services</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let pkg of packages">
                            <td class="ps-4">
                                <div class="fw-bold text-dark">{{ pkg.name }}</div>
                            </td>
                            <td>
                                <div class="text-truncate" style="max-width: 300px;">{{ pkg.description }}</div>
                            </td>
                            <td>
                                <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill fw-bold">
                                    {{ pkg.price | currency:'SAR ':'symbol':'1.2-2' }}
                                </span>
                            </td>
                            <td>
                                <div class="d-flex flex-wrap gap-1">
                                    <span *ngFor="let svc of pkg.services"
                                        class="badge bg-info-subtle text-info rounded-pill px-2">
                                        {{ svc.name }}
                                    </span>
                                    <span *ngIf="pkg.services.length === 0" class="text-muted small">No services</span>
                                </div>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-outline-primary btn-sm me-1 rounded-pill px-3"
                                    [routerLink]="['/packages/edit', pkg.id]">
                                    Edit
                                </button>
                                <button class="btn btn-light btn-sm rounded-circle text-danger"
                                    (click)="deletePackage(pkg.id)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr *ngIf="packages.length === 0 && !loading">
                            <td colspan="5" class="text-center py-5">
                                <div class="text-muted">
                                    <i class="bi bi-box-seam fs-1 d-block mb-3 opacity-50"></i>
                                    <p class="mb-0">No packages found.</p>
                                    <small>Click "Create Package" to get started.</small>
                                </div>
                            </td>
                        </tr>
                        <tr *ngIf="loading">
                            <td colspan="5" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
