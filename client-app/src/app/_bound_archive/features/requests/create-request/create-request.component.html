<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0 glass-card">
                <div class="card-header bg-primary text-white p-4">
                    <h3 class="mb-0"><i class="bi bi-person-plus me-2"></i>New Screening Request</h3>
                    <p class="mb-0 opacity-75">Submit a new candidate for health screening and verification.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form [formGroup]="requestForm" (ngSubmit)="submit()">
                        <h5 class="mb-4 text-secondary section-title">Candidate Information</h5>
                        <div class="row g-4 mb-5">
                            <div class="col-md-12">
                                <label class="form-label">Full Name (as per National ID/Passport)</label>
                                <input type="text" class="form-control form-control-lg"
                                    formControlName="candidateFullName" placeholder="e.g. John Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">National ID / Iqama</label>
                                <input type="text" class="form-control" formControlName="nationalID"
                                    placeholder="10 Digits ID">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mobile Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">+966</span>
                                    <input type="text" class="form-control" formControlName="mobileNumber"
                                        placeholder="5XXXXXXXX">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Gender</label>
                                <select class="form-select" formControlName="gender">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Expected Visit Date</label>
                                <input type="date" class="form-control" formControlName="expectedVisitDate">
                            </div>
                        </div>

                        <h5 class="mb-4 text-secondary section-title">Job & Location Details</h5>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">Position / Job Title</label>
                                <input type="text" class="form-control" formControlName="position"
                                    placeholder="e.g. Software Engineer">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Department</label>
                                <input type="text" class="form-control" formControlName="department"
                                    placeholder="e.g. IT Department">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Work Location / Branch</label>
                                <input type="text" class="form-control" formControlName="branchLocation"
                                    placeholder="Select or enter branch">
                            </div>
                        </div>

                        <div class="alert alert-light border shadow-sm mt-5 mb-4 p-4">
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-shield-check text-success fs-3 me-3"></i>
                                <h6 class="mb-0">Selected Screening Package</h6>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-primary px-3 py-2">Standard Screening (Pre-Employment)</span>
                                    <p class="mb-0 mt-2 small text-muted">Includes: CBC, Vision Test, General Physical,
                                        Drug Test.</p>
                                </div>
                                <div class="text-end">
                                    <span class="fw-bold fs-5 text-primary">250.00 SAR</span>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 mt-5">
                            <button type="button" class="btn btn-outline-secondary px-4"
                                routerLink="/requests/list">Cancel</button>
                            <button type="submit" class="btn btn-primary px-5 py-2 fw-semibold shadow-sm"
                                [disabled]="requestForm.invalid">
                                Submit Request<i class="bi bi-send-fill ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
